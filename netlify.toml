[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**", "db/**"]

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Schedules are defined in each function file via `export const config = { schedule: "..." }`:
#   scheduled-lead-gen.ts        — every 4h
#   scheduled-deep-research.ts   — every 30m
#   scheduled-heartbeat.ts       — hourly
